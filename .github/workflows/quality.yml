name: Quality

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.5'
          architecture: 'x64'
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run required quality gate
        run: python -B tools/quality.py
      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics-${{ github.run_id }}
          path: |
            evaluation_results/quality-*/pytest.txt
            evaluation_results/quality-*/pytest/pytest.xml
          if-no-files-found: warn
          retention-days: 7
