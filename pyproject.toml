[tool.ruff]
target-version = "py313"
line-length = 100
include = ["harness/**/*.py", "reversi_player/**/*.py", "tests/**/*.py", "tools/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/fixtures/budget_player.py" = ["E402"]

[tool.ruff.format]
quote-style = "single"
exclude = [
    "harness/analysis.py", "harness/contracts.py", "harness/evaluate.py",
    "harness/openings.py", "harness/protocol.py", "harness/search_budget.py",
    "harness/statistics.py", "reversi_player/reversi.py", "reversi_player/web.py", "tests/test_harness.py",
    "tests/test_result.py", "tests/test_stdin_commands.py", "tests/fixtures/*.py",
]

[tool.mypy]
python_version = "3.13"
strict = true
explicit_package_bases = true
files = ["harness/referee.py", "harness/seeded_player.py", "tools/quality.py", "tools/evidence.py", "tools/evidence_plugin.py", "harness/statistics.py", "reversi_player/reversi.py", "reversi_player/ai_engine.py", "reversi_player/search_trace.py", "reversi_player/timed_search.py", "reversi_player/ntuple.py", "reversi_player/ntuple_io.py", "reversi_player/phase6_player.py", "harness/openings.py", "harness/protocol.py", "harness/search_budget.py", "harness/contracts.py", "harness/analysis.py", "harness/evaluate.py", "harness/__init__.py", "tools/__init__.py", "tools/feedback.py", "tools/phase65_decode.py", "tools/phase65_data.py", "tools/phase65_train.py", "tools/phase65_experiment.py", "tools/phase7_td.py", "tools/phase7_train.py", "tools/phase7_eval.py", "tools/phase7_results.py", "tools/phase7_longrun.py", "tools/phase7_longrun_data.py", "tools/phase7_longrun_os.py", "tools/phase7_longrun_reports.py"]
